spring.application.name=Student_Management_Portal
# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Static Resources (CSS, JS, Images)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/resources/**

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/VidyaSetu?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.error.whitelabel.enabled=false

# Tomcat JSP Support (for embedded Tomcat)
server.servlet.jsp.init-parameters.development=true